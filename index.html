<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Манга Орчуулгийн Апп</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="text-center text-white mb-8">
            <h1 class="text-4xl font-bold mb-2">📚 Манга Орчуулгийн Апп</h1>
            <p class="text-lg">Зурган дээрх текстийг танин орчуулдаг апп</p>
        </div>
        
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-md mx-auto">
            <div class="text-center">
                <div class="mb-6">
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <label for="imageInput" class="bg-blue-500 text-white px-6 py-3 rounded-lg cursor-pointer hover:bg-blue-600 inline-block">
                        📷 Зурга Сонгох
                    </label>
                </div>
                
                <div id="imagePreview" class="hidden mb-4">
                    <img id="uploadedImage" class="w-full rounded-lg shadow-md mb-4">
                    <button id="processBtn" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600">
                        🔄 Боловсруулах
                    </button>
                </div>
                
                <div id="results" class="hidden">
                    <h3 class="text-lg font-bold mb-2">Танигдсан текст:</h3>
                    <div class="bg-gray-100 p-4 rounded-lg text-left">
                        <p>Жишээ: "Энэ бол манга орчуулга!"</p>
                    </div>
                    <button id="downloadBtn" class="bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600 mt-4">
                        💾 Татаж авах
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadedImage = document.getElementById('uploadedImage');
        const processBtn = document.getElementById('processBtn');
        const results = document.getElementById('results');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        processBtn.addEventListener('click', function() {
            // Симуляци - жинхэнэ OCR API оронд
            setTimeout(() => {
                results.classList.remove('hidden');
            }, 1500);
        });
    </script>
</body>
</html>
